# Copy to .hookmon-policy.yaml at your project root (or point --policy-file /
# HOOKMON_POLICY_FILE at a different path) and check it in — this is meant to
# be a shared, reviewed policy, not personal config.
#
# A missing file, a file that fails to parse, or a hook event/tool that
# matches no rule below all resolve to "allow" (fail-open), same as if no
# policy were configured at all.
#
# Only events with real blocking support in each provider act on this file:
# Claude Code's PreToolUse, and Cursor's preToolUse, postToolUse,
# postToolUseFailure, beforeShellExecution, beforeMCPExecution,
# beforeReadFile, subagentStart, beforeTabFileRead. Rules for other events
# are parsed but never enforced.
rules:
  # Block direct Bash calls from Claude Code; everything else stays allowed.
  - event: PreToolUse
    agent: claudecode
    tools: ["Bash"]
    action: deny
    reason: "Direct Bash calls are blocked by hookmon policy; use the approved CI wrapper instead."

  # Same idea for Cursor's shell hook.
  - event: beforeShellExecution
    agent: cursor
    action: deny
    reason: "Shell execution is blocked by hookmon policy."

  # `paths` scopes a rule to specific files instead of blocking a tool
  # outright: this only blocks Read/Write when the file path matches one of
  # the patterns, gitignore-style (a bare pattern like ".env" matches at any
  # depth, matched against whole path components — never a substring, so a
  # file like "foo.envelope.txt" is NOT caught by ".env"). Cursor isn't
  # covered here: it has no "Read"/"Write" tool names (its file hooks are
  # events like beforeReadFile) and its provider has no blocking-capable
  # write hook today.
  - event: PreToolUse
    agent: claudecode
    tools: ["Read", "Write"]
    paths: [".env"]
    action: deny
    reason: ".env files are blocked by hookmon policy; secrets must not be read or edited by the agent."

  # `commands` scopes a rule to Bash calls whose command string contains one
  # of the given substrings (matched against tool_input.command; not a glob
  # or regex, so "git push" also catches "git push --force" and "git push
  # origin main"). An empty/unknown command (e.g. a non-Bash tool) never
  # matches, same fail-open behavior as `paths`.
  - event: PreToolUse
    agent: claudecode
    tools: ["Bash"]
    commands: ["git push"]
    action: deny
    reason: "git push is blocked by hookmon policy; pushing requires explicit user action outside the agent."

  # More examples of commands worth blocking by default in an agentic
  # coding setup — each is a plain substring match, so these are blunt:
  # "rm -rf" also catches harmless cleanup like "rm -rf ./build", and
  # "sudo" also catches read-only uses like "sudo apt list". Adjust to
  # taste before relying on these. A single rule can list several
  # `commands` patterns — any one of them matching is enough.
  - event: PreToolUse
    agent: claudecode
    tools: ["Bash"]
    commands: ["rm -rf", "git reset --hard", "git clean -fd", "sudo"]
    action: deny
    reason: "This command is blocked by hookmon policy; it can destroy work or escalate privileges."

  # Blocks the "download a script and pipe it straight into a shell"
  # pattern (remote code execution), e.g. "curl ... | sh" or
  # "wget ... | bash". Uses `ask` instead of `deny` since a bare `curl`/
  # `wget` isn't inherently dangerous — only piping it into a shell is.
  - event: PreToolUse
    agent: claudecode
    tools: ["Bash"]
    commands: ["curl", "wget"]
    action: ask
    reason: "Network downloads via Bash require confirmation; piping into a shell is especially risky."


  # ---------------------------------------------------------------------
  # Semantic rules. `when:` asks the judgments declared below and compares
  # the answer to a threshold. These need HOOKMON_TYPESAFE_API_KEY to be
  # set; without it they simply never fire (fail-open), like everything
  # else in hookmon.
  #
  # `when:` ANDs with event/agent/tools/paths/commands, so adding one to an
  # existing rule can only ever make it fire LESS often. That makes
  # "narrow this blunt rule with a judgment" a strictly safe edit.
  # ---------------------------------------------------------------------

  # The semantic replacement for commands: ["rm -rf", "git reset --hard"].
  # Note there is deliberately no `commands:` prefilter: a lexical
  # prefilter would reopen exactly the bypass this rule closes, so every
  # Bash call is judged. `rm -rf ./build` is allowed; `rm -r -f ./src` and
  # `/bin/rm -rf src` are not.
  #
  # on-error: ask means a TypeSafe outage downgrades this to a prompt
  # rather than silently switching the protection off.
  - event: PreToolUse
    agent: claudecode
    tools: ["Bash"]
    when: { destroys_work: ">= 0.85" }
    on-error: ask
    action: deny
    reason: "This command would irreversibly destroy work. Run it yourself if you meant it."

  # A graded middle ground the substring blocklist had no way to express.
  - event: PreToolUse
    agent: claudecode
    tools: ["Bash"]
    when: { destroys_work: ">= 0.5", blast_radius: ">= 2" }
    action: ask
    reason: "This command may destroy work — confirm before running."

  # The semantic replacement for commands: ["curl", "wget"]. That rule had
  # to settle for `ask` because a bare `curl` isn't dangerous and
  # substrings can't tell the difference. This one states the real
  # condition, so it can be a `deny` while an ordinary API call is allowed.
  - event: PreToolUse
    agent: claudecode
    tools: ["Bash"]
    when: { executes_remote_code: ">= 0.8" }
    action: deny
    reason: "Downloading and executing remote code is blocked by hookmon policy."

  # Note the absence of `agent:` and `tools:`. Because the judgment reads
  # the raw tool_input rather than a hardcoded file_path field, this one
  # rule covers Claude Code's Read/Edit/Write, Cursor's beforeReadFile, and
  # any MCP tool — none of which a paths: rule can reach today.
  - event: PreToolUse
    when: { exposes_secrets: ">= 0.8" }
    action: deny
    reason: "Secrets must not be read, edited, or transmitted by the agent."

# Judgments are declared once and referenced by rules through `when:`.
# hookmon asks only the ones some already-matching rule needs, in a single
# request per hook event. A policy with no `when:` never calls out at all.
judgments:
  destroys_work:
    type: noul
    instructions: >
      Considering `tool_input` as a tool call about to run in the project at
      `cwd`: would running it irreversibly destroy source code, uncommitted
      changes, or data that the user could not easily recover?
    criteria:
      "true": >
        It deletes, overwrites, or resets files or history in a way that loses
        work with no straightforward undo — recursively deleting a source
        tree, discarding uncommitted changes, or force-overwriting published
        history.
      "false": >
        It is read-only, or it only affects regenerable artifacts such as
        build output, caches, temporary directories, or installed
        dependencies.

  executes_remote_code:
    type: noul
    instructions: >
      Does `tool_input` fetch content from the network and then execute it on
      this machine?
    criteria:
      "true": >
        Downloaded content is run as code or as a shell script — piping a
        download into a shell or interpreter, fetching and then running an
        installer, or evaluating a remote response.
      "false": >
        It only retrieves data to be read, saved, or inspected, or it installs
        from a package manager's normal, verified source.

  exposes_secrets:
    type: noul
    instructions: >
      Would this tool call read, write, or reveal credentials, private keys,
      or other secrets? Consider `tool`, the target path, and any command.
    criteria:
      "true": >
        The target is a file that normally holds secrets — a .env file, an SSH
        private key, cloud credentials, a service-account JSON, a keystore —
        or the call prints, copies, or transmits such a value.
      "false": >
        The target holds ordinary source, configuration, documentation, or
        test data with no real credentials, or the call only references a
        secret by variable name without revealing its value.

  blast_radius:
    type: score
    instructions: >
      Rate how much damage this tool call could do if it runs and turns out to
      be a mistake.
    criteria:
      - "None: read-only, or it only changes files the agent itself just created."
      - "Mild: modifies project files in ways that git or a rebuild can undo."
      - "Serious: loses uncommitted work, changes shared state outside the project, or installs software system-wide."
      - "Severe: destroys data with no backup, rewrites published history, exposes credentials, or takes an action outside this machine that cannot be recalled."

# Applies when no rule above matches. Defaults to "allow" if omitted.
default-action: allow
